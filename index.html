<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Кастомный селектор</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1>🎀Селектор🎀</h1>

            <fieldset class="settings">
                <legend>Настройки</legend>

                <label class="settings__item">
                    <input type="checkbox" id="toggle-search" />
                    Поиск
                </label>

                <label class="settings__item">
                    <input type="checkbox" id="toggle-multiple" />
                    Мультиселект
                </label>
            </fieldset>

            <div class="select" id="select">
                <button
                    type="button"
                    class="select__trigger"
                    aria-expanded="false"
                >
                    <span class="select__value">ВЫБЕРИТЕ БРЕНД</span>
                    <span class="select__arrow" aria-hidden="true"></span>
                </button>

                <div class="select__dropdown">
                    <input
                        type="text"
                        class="select__search"
                        placeholder="Поиск"
                    />
                    <ul class="select__options"></ul>
                </div>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
